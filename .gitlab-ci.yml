stages:
  - build
  - test
  - deploy

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: $REGISTRY/$CI_PROJECT_PATH
  IMAGE_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - develop

# PHP linting
test:php:
  stage: test
  image: php:8.2-alpine
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Running PHP lint..."
    - find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
    - echo "PHP lint completed successfully"
  only:
    - main
    - develop

# Code quality check
test:syntax:
  stage: test
  image: php:8.2-alpine
  script:
    - echo "Running syntax checks..."
    - php -v
    - echo "✓ PHP syntax checks completed"
  only:
    - main
    - develop

# Deploy to production
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl bash openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH && \
        git fetch origin && \
        git checkout main && \
        git pull origin main && \
        docker-compose pull && \
        docker-compose up -d && \
        docker-compose exec -T app php -r 'exit(0);' && \
        echo 'Deployment successful!'
      "
  only:
    - main
  when: manual
  environment:
    name: production
    url: $PRODUCTION_URL

# Deploy to staging
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl bash openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY_STAGING" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST_STAGING >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging..."
    - |
      ssh $DEPLOY_USER_STAGING@$DEPLOY_HOST_STAGING "
        cd $DEPLOY_PATH_STAGING && \
        git fetch origin && \
        git checkout develop && \
        git pull origin develop && \
        docker-compose pull && \
        docker-compose up -d && \
        docker-compose exec -T app php -r 'exit(0);' && \
        echo 'Staging deployment successful!'
      "
  only:
    - develop
  when: on_success
  environment:
    name: staging
    url: $STAGING_URL
